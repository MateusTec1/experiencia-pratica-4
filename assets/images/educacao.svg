      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#gradEdu)" />
  <circle cx="80" cy="60" r="90" fill="#FFFFFF" opacity="0.06" />
  <circle cx="340" cy="190" r="110" fill="#FFFFFF" opacity="0.08" />
  <!-- Monitor e código -->
  <g transform="translate(130, 45)">
    <rect x="0" y="0" width="140" height="95" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
    <rect x="55" y="95" width="30" height="22" fill="#334155" />
    <rect x="35" y="117" width="70" height="8" rx="4" fill="#64748B" />
