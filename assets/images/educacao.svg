    <rect x="16" y="44" width="75" height="5" rx="2" fill="#4ADE80" />
    <rect x="16" y="55" width="95" height="5" rx="2" fill="#FDE047" />
    <rect x="16" y="66" width="55" height="5" rx="2" fill="#F472B6" />
  </g>
  <text x="200" y="195" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
